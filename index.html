     Sayfa baska bir alt yola tasinirsa bu iki satiri da guncelle. -->

<style>
/* ============================================================
   Minthaven — tek ekran acilis sayfasi
   Sablon: potioncraft.com (tek viewport, kaydirmasiz, kose
   navigasyonu, ortada logo + magaza + serit butonlar).
   Stil: parsomen+simya yerine KOYU YESIL PLAYMAT + oyunun kendi
   proplarindan turetilmis gravur cizim. Tek doygun oge alt
   kenardaki acik binder — Potion Craft'taki kazanin karsiligi.

   YERLESIM: DOM sirasi MOBIL akisi belirler (sosyal > logo >
   magaza > butonlar > plakalar > altbilgi). Genis ekranda ayni
   ogeler absolute ile koselere gonderilir; orta kolon .col
   mobilde display:contents ile "yok olur". Tek isaretleme,
   iki duzen — ikinci bir mobil sayfa yok.
   ============================================================ */

@font-face{ font-family:'Pixelify'; src:url('assets/fonts/PixelifySans-Variable.ttf') format('truetype');
  font-weight:400 700; font-display:swap; }
@font-face{ font-family:'Silkscreen'; src:url('assets/fonts/Silkscreen-Regular.ttf') format('truetype');
  font-weight:400; font-display:swap; }
@font-face{ font-family:'Silkscreen'; src:url('assets/fonts/Silkscreen-Bold.ttf') format('truetype');
  font-weight:700; font-display:swap; }

:root{
  /* oyunun paleti — game/src/gfx/pixel.js PAL + style.css */
  --mat:#0e2618; --mat-deep:#081a11;
  --etch:#4a9468;
  --cream:#f5ead2;
  --ink:#3f2832;
  --gold:#feae34;
  --px:4px;                 /* piksel birimi: tum kenarliklar bunun kati */
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--mat-deep); }
body{
  min-height:100dvh; background:var(--mat-deep); color:var(--cream);
  font-family:'Pixelify',ui-monospace,monospace;
  -webkit-font-smoothing:none; -webkit-text-size-adjust:100%;
}
img{ image-rendering:pixelated; display:block; height:auto; }
a{ -webkit-tap-highlight-color:transparent; }

/* --- sahne --------------------------------------------------- */
.page{
  position:relative; min-height:100dvh; overflow:hidden;
  background:url('assets/bg_playmat.png') center/cover no-repeat, var(--mat);
  display:flex; flex-direction:column; align-items:center;
  justify-content:safe center;              /* kisa icerikte dikey ortala */
  gap:clamp(8px,2.2vw,16px);
  /* alt bosluk on plandaki binder'in GERCEK yuksekligini takip eder:
     fg genisligi min(104vw,900px), oran 876/1828 = 0.479
     (fg_desk.png yeniden uretilirse bu sayiyi da guncelle) */
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(min(104vw,900px) * .479 + 20px);
}
/* playmat dokusu: cok ince tarama — vinil hissi */
.page::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);
  opacity:.5; mix-blend-mode:multiply;
}
.page > *{ position:relative; z-index:3; }

/* --- ortak piksel kenarlik ----------------------------------- */
/* 4px'lik "arti seklinde" golge yigini centikli piksel koseleri verir */
.pxbox{
  background:var(--cream); color:var(--ink); text-decoration:none;
  box-shadow:0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
             calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink),
             var(--px) var(--px) 0 rgba(0,0,0,.5);
  transition:transform .06s steps(2), box-shadow .06s steps(2), background .1s;
}
.pxbox:hover{ background:var(--gold); transform:translate(2px,2px);
  box-shadow:0 calc(var(--px)*-1) 0 var(--ink), 0 var(--px) 0 var(--ink),
             calc(var(--px)*-1) 0 0 var(--ink), var(--px) 0 0 var(--ink); }

/* --- sosyal (mobilde en ust serit, masaustunde sag ust kose) -- */
.social-row{ display:flex; gap:clamp(2px,1.2vw,8px); align-items:center; }
.social{ display:inline-grid; place-items:center; width:clamp(34px,10vw,38px); height:38px;
  transition:transform .06s steps(2); }
.social svg{ width:clamp(22px,6vw,26px); height:clamp(22px,6vw,26px); fill:var(--cream);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
.social:hover{ transform:translateY(-3px); }
.social:hover svg{ fill:var(--gold); }
/* Threads gibi tek cizgiden olusan markalar: dolgu yerine kontur */
.social svg.line{ fill:none; stroke:var(--cream); stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round; }
.social:hover svg.line{ fill:none; stroke:var(--gold); }

/* --- logo ---------------------------------------------------- */
.logo{ width:min(430px,90vw); filter:drop-shadow(0 6px 0 rgba(0,0,0,.45)); }

/* --- ayrac: kesik cizgi + 45 derece donmus altin kare -------- */
.rule{ width:min(430px,84vw); display:flex; align-items:center; gap:10px; opacity:.85; }
.rule i{ flex:1; height:var(--px);
  background:repeating-linear-gradient(90deg,var(--etch) 0 var(--px),transparent var(--px) calc(var(--px)*2)); }
.rule b{ width:12px; height:12px; background:var(--gold); transform:rotate(45deg);
  box-shadow:0 0 0 var(--px) var(--mat-deep); }

/* --- serit butonlar: PixelLab ahsap tabelasi (9-slice) -------- */
.ribbons{ display:flex; flex-direction:column; gap:clamp(5px,1.4vw,9px);
  width:min(400px,94vw); }
.ribbon{
  display:flex; align-items:center; justify-content:center; gap:9px;
  min-height:52px; padding:4px 2px;
  color:var(--ink); text-decoration:none; text-align:center;
  font-family:'Silkscreen'; font-weight:700; letter-spacing:1px;
  font-size:clamp(10px,3vw,13px);
  /* sign.png 368x91; ic krem panel x16..353 / y15..75 -> dilim 15 16 */
  border-style:solid; border-width:14px 15px;
  border-image:url('assets/sign.png') 15 16 fill stretch;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,.45));
  transition:transform .06s steps(2), filter .06s steps(2);
}
.ribbon:hover{ border-image-source:url('assets/sign_hover.png');
  transform:translate(2px,2px); filter:none; }
.ribbon.primary{ border-image-source:url('assets/sign_hover.png');
  min-height:58px; font-size:clamp(11px,3.4vw,15px); }
.ribbon.primary:hover{ filter:drop-shadow(0 0 8px rgba(254,174,52,.55)); }
.ribbon svg{ width:16px; height:16px; fill:currentColor; flex:0 0 auto; }

/* --- yardimci sayfa plakalari -------------------------------- */
.plaques{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.plaque{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px 6px;
  font-family:'Silkscreen'; font-size:clamp(9px,2.6vw,11px); letter-spacing:1px;
  box-shadow:0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
             3px 3px 0 rgba(0,0,0,.45);
}
.plaque:hover{ box-shadow:0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); }
.plaque svg{ width:13px; height:13px; fill:currentColor; flex:0 0 auto; }

/* --- altbilgi: dil + imza ------------------------------------ */
.foot{ display:flex; align-items:center; justify-content:center;
  gap:6px clamp(14px,5vw,28px); flex-wrap:wrap; }
.lang{ display:flex; box-shadow:0 -3px 0 var(--ink), 0 3px 0 var(--ink),
       -3px 0 0 var(--ink), 3px 0 0 var(--ink), 3px 3px 0 rgba(0,0,0,.45); }
.lang button{ font-family:'Silkscreen'; font-size:11px; letter-spacing:1px; border:0; cursor:pointer;
  padding:8px 12px 7px; background:var(--cream); color:var(--ink); }
.lang button + button{ box-shadow:inset 3px 0 0 var(--ink); }
.lang button[aria-pressed="true"]{ background:var(--ink); color:var(--gold); }
.studio{ font-family:'Silkscreen'; font-size:clamp(8px,2.2vw,10px); letter-spacing:1px;
  color:#9dbfa9; text-shadow:0 2px 0 #000; text-decoration:none; text-align:center; }
.studio:hover{ color:var(--gold); }

/* --- on plan: acik binder (sayfanin tek doygun ogesi) --------- */
.fg{
  position:absolute; left:50%; bottom:-3vh; transform:translateX(-50%);
  width:min(900px,104vw); z-index:2; pointer-events:none;
  filter:drop-shadow(0 -8px 30px rgba(0,0,0,.6));
  animation:bob 7s ease-in-out infinite;
}
@keyframes bob{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,-7px); } }
@media (prefers-reduced-motion:reduce){ .fg{ animation:none; } }
.fg-shadow{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:min(900px,100vw); height:150px; z-index:1; pointer-events:none;
  background:radial-gradient(60% 100% at 50% 100%, rgba(0,0,0,.55), transparent 70%);
}

/* dar/kisa ekranda .col seffaf sarmalayici: cocuklari .page akisina girer */
.col{ display:contents; }

/* ============================================================
   GENIS EKRAN: ayni ogeler koselere dagilir, sayfa kaydirilmaz
   ============================================================ */
@media (min-width:880px) and (min-height:700px){
  body{ overflow:hidden; }
  .page{ height:100dvh; padding:0; display:block; }

  .social-row{ position:absolute; right:clamp(14px,2vw,26px); top:clamp(14px,2vh,26px); z-index:4; }
  .plaques{ position:absolute; left:clamp(14px,2vw,26px); top:clamp(14px,2vh,26px); z-index:4;
    flex-direction:column; align-items:flex-start; }
  .foot{ position:absolute; left:0; right:0; bottom:clamp(12px,2vh,22px); z-index:4;
    justify-content:space-between; padding:0 clamp(14px,2vw,26px); pointer-events:none; }
  .foot > *{ pointer-events:auto; }

  /* orta kolon: logo -> ayrac -> magaza -> butonlar -> ayrac */
  .col{ display:flex; position:absolute; left:50%; top:clamp(20px,5vh,64px);
    transform:translateX(-50%); flex-direction:column; align-items:center;
    gap:clamp(11px,1.8vh,18px); width:min(560px,86vw); z-index:3; }
  .logo{ width:min(470px,100%); }
  .fg{ width:min(900px,62vw); bottom:-6vh; }
}
</style>

</div>

<script>
/* Iki dil, tek sayfa — oyunun kendisi de TR/EN (src/i18n.js). */
const STR = {
  tr:{ press:'BASIN KITI', wiki:'WIKI', devlog:'GELISTIRME GUNLUGU',
       wishlist:"STEAM'DE ISTEK LISTENE EKLE", trailer:'FRAGMANI IZLE', news:'HABER BULTENINE KATIL',
       rights:'TUM HAKLARI SAKLIDIR' },
  en:{ press:'PRESS KIT', wiki:'WIKI', devlog:'DEVLOG',
       wishlist:'WISHLIST ON STEAM', trailer:'WATCH THE TRAILER', news:'JOIN THE NEWSLETTER',
       rights:'ALL RIGHTS RESERVED' }
};
function setLang(l){
  document.documentElement.lang = l;
  for(const el of document.querySelectorAll('[data-i18n]')) el.textContent = STR[l][el.dataset.i18n];
  for(const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang===l));
  try{ localStorage.setItem('mh_lang', l); }catch(e){}
}
for(const b of document.querySelectorAll('.lang button')) b.onclick = ()=> setLang(b.dataset.lang);
let start = 'tr';
try{
  const saved = localStorage.getItem('mh_lang');
  start = (saved === 'tr' || saved === 'en') ? saved
        : ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en');
}catch(e){}
setLang(start);
</script>
